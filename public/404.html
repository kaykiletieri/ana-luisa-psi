    <link rel="preload" as="image" href="assets/images/hero-bg1.webp" type="image/webp">
    <script>
        (function () {
            var pathSegments = window.location.pathname.split('/');
            var projectIndex = pathSegments.indexOf('ana-luisa-psi');
            if (projectIndex !== -1) {
                pathSegments.splice(0, projectIndex + 1);
            }
            var path = pathSegments.join('/');
            if (path && path !== 'index.html') {
                sessionStorage.setItem('github-pages-redirect', path);
            }
            window.location.href = '/' + (pathSegments.slice(0, projectIndex + 1).join('/') || '') + '/index.html';
        })();
    </script>
