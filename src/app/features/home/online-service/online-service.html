<section class="online-service">
    <div class="online-service__container">

        <div class="online-service__icon-wrapper" appScrollAnimate>
            <lucide-icon [img]="Video" [size]="28" class="online-service__icon"></lucide-icon>
        </div>

        <h2 class="online-service__title" appScrollAnimate>
            Atendimento online e presencial
        </h2>

        <p class="online-service__description" appScrollAnimate>
            Sessões seguras e sigilosas no conforto da sua casa, com atendimento online
            para todo o Brasil e presencial em Poços de Caldas - MG e Muzambinho - MG.
        </p>

        <ul class="online-service__locations" appScrollAnimate aria-label="Modalidades de atendimento e cidades atendidas">
            <li class="online-service__location">Online para todo o Brasil</li>
            <li class="online-service__location">Presencial em Poços de Caldas - MG</li>
            <li class="online-service__location">Presencial em Muzambinho - MG</li>
        </ul>

        <button class="online-service__cta" appScrollAnimate (click)="openWhatsApp()">
            Agendar agora
        </button>

    </div>
</section>
